name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults: { run: { working-directory: app } }
    env:
      TEST_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm run lint            # no float money, no ON DELETE CASCADE, typecheck
      - run: npm test                # migrations + RBAC + RLS + auth + FX + numbering against real PostgreSQL
      - run: npm run build
      - name: Phase 0 schema invariants
        working-directory: docs/phase-0/schema
        env: { PGHOST: 127.0.0.1, PGUSER: postgres, PGPASSWORD: postgres, PGDATABASE: erp_phase0 }
        run: |
          createdb erp_phase0
          ./run-tests.sh | tee out.txt
          grep -q "FAIL" out.txt && exit 1 || true
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
